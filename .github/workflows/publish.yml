name: Publish

# Runs when a GitHub release is published. Both registries authenticate with
# this workflow's OIDC token, so no publish secrets are stored in the repo:
# - JSR: the package must be linked to this repository in its JSR settings.
# - npm: this workflow is a trusted publisher of "airspool" on npmjs.com, allowed
#   to stage versions only. A staged version goes live once a maintainer approves
#   it with 2FA, on npmjs.com or with `npm stage approve <stage-id>`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The release tag matches deno.json and package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          deno_version=$(jq -r .version deno.json)
          npm_version=$(jq -r .version package.json)
          echo "tag $TAG, deno.json $deno_version, package.json $npm_version"
          test "$TAG" = "v$deno_version"
          test "$TAG" = "v$npm_version"
          grep -q "^## \[$deno_version\]" CHANGELOG.md
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: deno publish --dry-run
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in a release build
      - run: npm ci
      - run: npm run build
      - run: npm run test:node
      - run: npm pack --dry-run

  jsr:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Skipped when this version is already on JSR, so re-running a failed run is safe.
      - name: Publish to JSR
        run: |
          version=$(jq -r .version deno.json)
          if curl -sf https://jsr.io/@munimh/airspool/meta.json | jq -e --arg v "$version" '.versions[$v]' > /dev/null; then
            echo "@munimh/airspool@$version is already on JSR; nothing to do."
            exit 0
          fi
          deno publish

  npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Staged publishing needs a recent npm 11.
      - run: npm install -g npm@^11.19.0
      - run: npm ci
      # prepublishOnly builds the package and runs the Node check first.
      # Skipped when this version is already published. Retried when Sigstore answers
      # 409 to npm's own retried upload (https://github.com/npm/cli/issues/10078):
      # npm stops before staging then, and a new attempt signs with a new key.
      - name: Stage on npm
        run: |
          set -o pipefail
          version=$(jq -r .version package.json)
          if npm view "airspool@$version" version > /dev/null 2>&1; then
            echo "airspool@$version is already on npm; nothing to do."
            exit 0
          fi
          for attempt in 1 2 3; do
            if npm stage publish --provenance --access public 2>&1 | tee npm-stage.log; then
              exit 0
            fi
            if ! grep -q TLOG_CREATE_ENTRY_ERROR npm-stage.log || [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::Sigstore rejected the provenance upload (attempt $attempt); retrying in 30 s."
            sleep 30
          done
