name: Publish

# Runs when a GitHub release is published. Both registries authenticate with
# this workflow's OIDC token, so no publish secrets are stored in the repo:
# - JSR: the package must be linked to this repository in its JSR settings.
# - npm: this workflow must be added as a trusted publisher of "airspool" on
#   npmjs.com. npm then adds provenance on its own.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release tag matches deno.json and package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          deno_version=$(jq -r .version deno.json)
          npm_version=$(jq -r .version package.json)
          echo "tag $TAG, deno.json $deno_version, package.json $npm_version"
          test "$TAG" = "v$deno_version"
          test "$TAG" = "v$npm_version"
          grep -q "^## \[$deno_version\]" CHANGELOG.md
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: deno publish --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run test:node
      - run: npm pack --dry-run

  jsr:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno publish

  npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # prepublishOnly builds the package and runs the Node check first.
      - run: npm publish --provenance --access public
